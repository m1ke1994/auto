[project]
name = "tracknode-ai-recommendations"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "gunicorn>=23,<24",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "redis>=5,<6",
  "celery[redis]>=5.4,<6", "openai>=1.109,<3", "python-json-logger>=2,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.7,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008", "B904", "UP017", "UP042"]
