name: TrackNode Studio checks

on:
  push:
    branches: [tracknode-2.0]
    paths:
      - 'ydro/ai_builder/**'
      - 'ydro/config/**'
      - 'ydro/vue-admin/**'
      - 'ydro/docker/studio-agent/**'
      - 'ydro/docker/studio-audit/**'
      - 'ydro/studio-e2e/**'
      - 'ydro/studio-*.ps1'
      - 'ydro/start-studio.ps1'
      - 'ydro/requirements.txt'
      - 'ydro/docker-compose*.yml'
      - '.github/workflows/tracknode-studio-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ydro
    env:
      DJANGO_ENV: development
      DB_ENGINE: sqlite
      SQLITE_NAME: /tmp/tracknode-studio-tests.sqlite3
      STUDIO_AI_PROVIDER: demo
      STUDIO_DEMO_ENABLED: "1"
      STUDIO_CINEMATIC_ENABLED: "1"
      # Match the local Docker runtime; tests isolate their own worker fixtures.
      STUDIO_WORKER_REQUIRED: "1"
      RUN_SEED_DEMO_DATA: "0"
      RUN_SEED_TRACKNODE_SITE: "0"
      RUN_SEED_MY_PORTFOLIO_SITE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ydro/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations ai_builder --check --dry-run
      - run: python manage.py test ai_builder --noinput --verbosity 2
      - run: python -m unittest -v test_block_edit test_scene_components
        working-directory: ydro/docker/studio-agent
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ydro/vue-admin
    env:
      VITE_STUDIO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ydro/vue-admin/package-lock.json
      - run: npm ci
      - run: npx vite build --mode example
      - run: node --test ../docker/studio-agent/cinematic-motion.test.mjs ../docker/studio-audit/capture.test.mjs
      - shell: pwsh
        run: ../studio-validate-scripts.ps1
  worker-recovery-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: ydro
    steps:
      - uses: actions/checkout@v4
      - run: .\studio-validate-scripts.ps1
      - run: .\studio-worker-smoke.ps1
      - run: .\studio-manual-smoke.ps1
  visual-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/tn-browser"
          npm install --prefix "$RUNNER_TEMP/tn-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/tn-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run real browser preview test
        working-directory: ydro
        run: |
          python -c "from ai_builder.visual_bridge import BRIDGE; from pathlib import Path; Path('/tmp/tn-visual-bridge.html').write_text(BRIDGE, encoding='utf-8')"
          cp studio-e2e/visual-bridge.mjs "$RUNNER_TEMP/tn-browser/"
          TN_BRIDGE_HTML=/tmp/tn-visual-bridge.html TN_BROWSER_REPORT="$RUNNER_TEMP/tn-browser-report" node "$RUNNER_TEMP/tn-browser/visual-bridge.mjs"
      - name: Install Vue application dependencies
        working-directory: ydro/vue-admin
        run: npm ci
      - name: Test actual Vue Studio component
        working-directory: ydro
        run: |
          cp studio-e2e/studio-component.mjs "$RUNNER_TEMP/tn-browser/"
          TN_VUE_ROOT="$PWD/vue-admin" TN_COMPONENT_HTML="$PWD/studio-e2e/studio-component.html" TN_COMPONENT_ENTRY="$PWD/studio-e2e/studio-component-entry.mjs" TN_BRIDGE_HTML=/tmp/tn-visual-bridge.html TN_BROWSER_REPORT="$RUNNER_TEMP/tn-browser-report" node "$RUNNER_TEMP/tn-browser/studio-component.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-visual-browser-report
          path: ${{ runner.temp }}/tn-browser-report
  carousel-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: ydro/vue-admin
      - run: |
          mkdir -p "$RUNNER_TEMP/tn-carousel"
          npm install --prefix "$RUNNER_TEMP/tn-carousel" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/tn-carousel/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test shared Vue carousel in Chromium
        working-directory: ydro
        run: |
          cp studio-e2e/carousel-browser.mjs "$RUNNER_TEMP/tn-carousel/"
          TN_VUE_ROOT="$PWD/vue-admin" TN_CAROUSEL_SOURCE="$PWD/docker/studio-agent/SceneCarousel.vue" TN_CAROUSEL_ENTRY="$PWD/studio-e2e/carousel-entry.mjs" TN_BROWSER_REPORT="$RUNNER_TEMP/tn-carousel-report" node "$RUNNER_TEMP/tn-carousel/carousel-browser.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-carousel-report
          path: ${{ runner.temp }}/tn-carousel-report
